<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>求职录</title>
<meta name="description" content="求职录 - 记录每一次求职投递与面试进程">
<meta name="theme-color" content="#00C896">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="求职录">
<style>
  :root {
    --primary: #00C896;
    --primary-dark: #00A97F;
    --primary-light: #D6F8EE;
    --blue: #4C7DFF;
    --blue-light: #E8EEFF;
    --orange: #FF8A5C;
    --orange-light: #FFF0E9;
    --yellow: #FFC53D;
    --yellow-light: #FFF6DF;
    --purple: #7C5CFF;
    --purple-light: #EFEAFF;
    --teal: #00B8D9;
    --teal-light: #E0F7FB;
    --gray: #94A3B8;
    --gray-light: #EEF2F7;
    --ink: #1F2937;
    --ink-2: #6B7280;
    --bg: #F4FBF8;
    --card: #FFFFFF;
    --radius: 20px;
    --shadow: 0 6px 20px rgba(16, 185, 129, .08), 0 2px 6px rgba(31, 41, 55, .04);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: linear-gradient(170deg, #EAFBF4 0%, #F4FBF8 40%, #EFF4FF 100%);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100dvh;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(12px + env(safe-area-inset-top)) 16px calc(110px + var(--safe-bottom));
  }

  /* ===== Header ===== */
  header.top {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 2px 14px;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, #00C896, #4C7DFF);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0, 200, 150, .35);
  }
  .logo svg { width: 24px; height: 24px; }
  .title-box { flex: 1; }
  .title-box h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .title-box p { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 12px; border: none;
    background: var(--card); box-shadow: var(--shadow); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-2); flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(.93); }
  .icon-btn svg { width: 20px; height: 20px; }

  /* ===== Stats ===== */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin-bottom: 14px;
  }
  .stat-card {
    background: var(--card); border-radius: 16px; padding: 12px 6px;
    text-align: center; box-shadow: var(--shadow);
  }
  .stat-card .num { font-size: 22px; font-weight: 800; line-height: 1.1; }
  .stat-card .lbl { font-size: 11px; color: var(--ink-2); margin-top: 3px; }
  .stat-card .num.green { color: var(--primary-dark); }
  .stat-card .num.blue { color: var(--blue); }
  .stat-card .num.orange { color: var(--orange); }
  .stat-card .num.gray { color: var(--ink-2); }

  /* ===== Upcoming reminder ===== */
  .reminder {
    display: none; margin-bottom: 14px;
    background: linear-gradient(120deg, #FFF6DF, #FFEBD3);
    border-radius: var(--radius); padding: 14px 16px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .reminder.show { display: flex; align-items: center; gap: 12px; }
  .reminder .bell {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(255, 197, 61, .4);
  }
  .reminder .bell svg { width: 22px; height: 22px; color: #E8A000; }
  .reminder .txt { flex: 1; min-width: 0; }
  .reminder .txt b { font-size: 14px; display: block; }
  .reminder .txt span { font-size: 12px; color: #8a6d1f; display: block; margin-top: 2px; }
  .reminder .countdown {
    font-size: 13px; font-weight: 800; color: #E8A000; white-space: nowrap;
    background: #fff; border-radius: 20px; padding: 5px 12px;
  }

  /* ===== Filter chips ===== */
  .chips {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 14px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; border: none; cursor: pointer;
    background: var(--card); color: var(--ink-2);
    font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 20px; box-shadow: var(--shadow);
    transition: all .18s;
  }
  .chip.active { color: #fff; background: var(--primary); box-shadow: 0 4px 10px rgba(0, 200, 150, .35); }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .chip.active .dot { background: #fff; }

  /* ===== Section ===== */
  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    margin: 6px 2px 10px;
  }
  .section-title h2 { font-size: 16px; font-weight: 700; }
  .section-title .count { font-size: 12px; color: var(--ink-2); background: var(--card); padding: 3px 10px; border-radius: 12px; box-shadow: var(--shadow); }

  /* ===== Card ===== */
  .card {
    background: var(--card); border-radius: var(--radius); padding: 14px 16px;
    margin-bottom: 12px; box-shadow: var(--shadow);
    cursor: pointer; position: relative; overflow: hidden;
    transition: transform .15s;
  }
  .card:active { transform: scale(.98); }
  .card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: var(--st, var(--gray));
  }
  .card .row1 { display: flex; align-items: flex-start; gap: 10px; }
  .card .avatar {
    width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0;
    background: var(--av, var(--gray-light));
    color: #fff; font-weight: 800; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .card .main { flex: 1; min-width: 0; }
  .card .company { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .card .company .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .position { font-size: 13px; color: var(--ink-2); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .card .position .sep { color: var(--gray); }
  .badge {
    font-size: 11px; font-weight: 700; color: #fff;
    padding: 3px 10px; border-radius: 12px; flex-shrink: 0;
  }
  .card .meta { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .card .meta .item { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-2); }
  .card .meta .item svg { width: 14px; height: 14px; }
  .card .next { color: #E8A000; font-weight: 700; }
  .card .todos { margin-top: 10px; }
  .card .todo-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--ink-2); background: var(--gray-light);
    padding: 4px 10px; border-radius: 10px; margin: 0 6px 4px 0;
  }
  .card .todo-pill.done { color: var(--gray); text-decoration: line-through; }
  .card .actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    border: none; cursor: pointer; font-size: 13px; font-weight: 700;
    padding: 9px 14px; border-radius: 14px; flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    transition: all .15s;
  }
  .btn:active { transform: scale(.95); }
  .btn svg { width: 15px; height: 15px; }
  .btn.primary { background: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(0, 200, 150, .3); }
  .btn.ghost { background: var(--gray-light); color: var(--ink-2); }
  .btn.danger { background: #FEE2E2; color: #DC2626; }

  /* ===== Empty ===== */
  .empty {
    text-align: center; padding: 48px 20px; color: var(--ink-2);
  }
  .empty svg { width: 72px; height: 72px; opacity: .5; margin-bottom: 12px; }
  .empty h3 { font-size: 16px; color: var(--ink); margin-bottom: 6px; }
  .empty p { font-size: 13px; line-height: 1.6; }

  /* ===== FAB ===== */
  .fab {
    position: fixed; right: max(20px, calc(50% - 220px)); bottom: calc(24px + var(--safe-bottom));
    width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, #00C896, #00A97F);
    color: #fff; box-shadow: 0 8px 20px rgba(0, 200, 150, .45);
    display: flex; align-items: center; justify-content: center;
    z-index: 50; transition: transform .15s;
  }
  .fab:active { transform: scale(.9); }
  .fab svg { width: 28px; height: 28px; }

  /* ===== Modal ===== */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(31, 41, 55, .45);
    z-index: 100; display: none; align-items: flex-end; justify-content: center;
    opacity: 0; transition: opacity .2s;
  }
  .modal-mask.show { display: flex; opacity: 1; }
  .modal {
    background: #fff; width: 100%; max-width: 480px;
    border-radius: 24px 24px 0 0; padding: 20px 20px calc(24px + var(--safe-bottom));
    max-height: 90dvh; overflow-y: auto;
    transform: translateY(40px); transition: transform .25s ease;
    -webkit-overflow-scrolling: touch;
  }
  .modal-mask.show .modal { transform: translateY(0); }
  .modal .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--gray-light); margin: 0 auto 16px; }
  .modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
  .modal h3 .close { width: 30px; height: 30px; border: none; background: var(--gray-light); border-radius: 50%; cursor: pointer; color: var(--ink-2); font-size: 14px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
  .field label .req { color: var(--orange); }
  .field input, .field select, .field textarea {
    width: 100%; border: 2px solid var(--gray-light); border-radius: 14px;
    padding: 11px 14px; font-size: 15px; font-family: inherit; color: var(--ink);
    background: #FAFCFB; outline: none; transition: border-color .15s;
    -webkit-appearance: none; appearance: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); background: #fff; }
  .field textarea { resize: vertical; min-height: 64px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: ''; position: absolute; right: 14px; top: 50%;
    width: 8px; height: 8px; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }

  /* todos editor */
  .todo-list { margin-top: 4px; }
  .todo-item {
    display: flex; align-items: center; gap: 10px;
    background: #FAFCFB; border-radius: 12px; padding: 8px 12px; margin-bottom: 8px;
  }
  .todo-item .tcheck {
    width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--gray-light);
    flex-shrink: 0; cursor: pointer; background: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .todo-item .tcheck.checked { background: var(--primary); border-color: var(--primary); }
  .todo-item .tcheck svg { width: 13px; height: 13px; color: #fff; display: none; }
  .todo-item .tcheck.checked svg { display: block; }
  .todo-item input[type=text] {
    flex: 1; border: none; background: transparent; font-size: 14px; outline: none; color: var(--ink); font-family: inherit;
  }
  .todo-item input[type=text].done { text-decoration: line-through; color: var(--gray); }
  .todo-item .tdel { border: none; background: none; color: var(--gray); cursor: pointer; font-size: 16px; padding: 2px 4px; }
  .btn.add-todo {
    flex: none; background: var(--primary-light); color: var(--primary-dark);
    padding: 8px 14px; font-size: 13px;
  }
  .modal .submit {
    width: 100%; padding: 14px; font-size: 16px; border-radius: 16px; margin-top: 8px;
    background: linear-gradient(135deg, #00C896, #00A97F); color: #fff; border: none;
    font-weight: 800; cursor: pointer; box-shadow: 0 6px 16px rgba(0, 200, 150, .35);
  }
  .modal .submit:active { transform: scale(.98); }
  .modal .delete-btn {
    width: 100%; padding: 12px; border-radius: 16px; margin-top: 10px;
    background: #FEF2F2; color: #DC2626; border: none; font-size: 14px; font-weight: 700; cursor: pointer;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
    bottom: calc(100px + var(--safe-bottom)); background: rgba(31, 41, 55, .92); color: #fff;
    font-size: 13px; padding: 10px 18px; border-radius: 22px; z-index: 200;
    opacity: 0; pointer-events: none; transition: all .25s; max-width: 84vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== Confirm ===== */
  .confirm-mask { position: fixed; inset: 0; background: rgba(31, 41, 55, .5); z-index: 150; display: none; align-items: center; justify-content: center; }
  .confirm-mask.show { display: flex; }
  .confirm-box {
    background: #fff; border-radius: 20px; padding: 22px; width: 82%; max-width: 320px;
    text-align: center; animation: pop .2s;
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .confirm-box h4 { font-size: 16px; margin-bottom: 8px; }
  .confirm-box p { font-size: 13px; color: var(--ink-2); margin-bottom: 18px; line-height: 1.6; }
  .confirm-box .btns { display: flex; gap: 10px; }
  .confirm-box .btns button { flex: 1; padding: 11px; border-radius: 14px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
  .confirm-box .btns .ok { background: #DC2626; color: #fff; }
  .confirm-box .btns .cancel { background: var(--gray-light); color: var(--ink-2); }

  /* export menu */
  .export-menu { display: none; }
  .export-menu.show { display: block; position: fixed; inset: 0; z-index: 120; }
  .export-menu .mask { position: absolute; inset: 0; background: rgba(31, 41, 55, .35); }
  .export-menu .sheet {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; background: #fff;
    border-radius: 24px 24px 0 0; padding: 20px 20px calc(20px + var(--safe-bottom));
    animation: slideup .25s;
  }
  @keyframes slideup { from { transform: translateX(-50%) translateY(40px); } to { transform: translateX(-50%) translateY(0); } }
  .export-menu .sheet h3 { font-size: 17px; font-weight: 800; text-align: center; margin-bottom: 14px; }
  .export-menu .opt {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 13px 14px; border-radius: 14px; border: none; background: #F6F9F8;
    font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; margin-bottom: 8px;
    text-align: left; font-family: inherit;
  }
  .export-menu .opt svg { width: 20px; height: 20px; flex-shrink: 0; }
  .export-menu .opt small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 400; margin-top: 2px; }

  .install-hint {
    margin-bottom: 14px; background: var(--card); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow); font-size: 13px; color: var(--ink-2); line-height: 1.7;
    display: none;
  }
  .install-hint.show { display: block; }
  .install-hint b { color: var(--primary-dark); }

  /* ===== 视图切换 ===== */
  .view-switch {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    background: var(--card); border-radius: 16px; padding: 4px;
    box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .view-switch button {
    border: none; background: transparent; cursor: pointer; padding: 9px 4px;
    border-radius: 12px; font-size: 13px; font-weight: 700; color: var(--ink-2);
    font-family: inherit; transition: all .15s;
  }
  .view-switch button.active { background: var(--primary); color: #fff; box-shadow: 0 3px 8px rgba(0, 200, 150, .3); }

  /* ===== 看板 ===== */
  .kanban { display: flex; flex-direction: column; gap: 12px; }
  .kanban-col {
    background: var(--card); border-radius: var(--radius); padding: 12px;
    box-shadow: var(--shadow);
  }
  .kanban-col .col-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .kanban-col .col-dot { width: 10px; height: 10px; border-radius: 50%; }
  .kanban-col .col-title { font-size: 14px; font-weight: 800; }
  .kanban-col .col-count {
    font-size: 11px; color: var(--ink-2); background: var(--gray-light);
    padding: 2px 8px; border-radius: 10px; margin-left: auto;
  }
  .kanban-card {
    background: #fff; border: 1px solid var(--gray-light); border-radius: 14px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: transform .12s;
    box-shadow: 0 2px 6px rgba(0,0,0,.03);
  }
  .kanban-card:active { transform: scale(.97); }
  .kanban-card .kc-company { font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .kanban-card .kc-company .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kanban-card .kc-pos { font-size: 12px; color: var(--ink-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kanban-card .kc-meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11px; color: var(--ink-2); flex-wrap: wrap; }
  .kanban-card .kc-next { color: #E8A000; font-weight: 700; }
  .kanban-empty { text-align: center; color: var(--gray); font-size: 12px; padding: 14px 0 4px; }

  /* ===== 漏斗统计 ===== */
  .funnel-card {
    background: var(--card); border-radius: var(--radius); padding: 14px 16px;
    margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .funnel-card h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .funnel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .funnel-row .f-label { width: 64px; font-size: 12px; color: var(--ink-2); font-weight: 600; flex-shrink: 0; }
  .funnel-row .f-bar-wrap { flex: 1; display: flex; align-items: center; gap: 8px; }
  .funnel-row .f-bar {
    height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 800; min-width: 30px;
    transition: width .4s ease;
  }
  .funnel-row .f-note { font-size: 11px; color: var(--gray); white-space: nowrap; }
  .funnel-tip { font-size: 11px; color: var(--ink-2); line-height: 1.6; }

  /* ===== 日历 ===== */
  .cal-card {
    background: var(--card); border-radius: var(--radius); padding: 14px 16px;
    margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head .cal-title { font-size: 15px; font-weight: 800; }
  .cal-head .cal-nav { display: flex; gap: 6px; }
  .cal-head .cal-nav button {
    border: none; background: var(--gray-light); color: var(--ink-2);
    width: 30px; height: 30px; border-radius: 9px; cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center; font-family: inherit;
  }
  .cal-head .cal-nav button:active { background: var(--primary); color: #fff; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--gray); font-weight: 600; padding: 4px 0; }
  .cal-day {
    position: relative; aspect-ratio: 1; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--ink-2); cursor: pointer; border: none;
    background: transparent; font-family: inherit; padding: 0;
  }
  .cal-day:hover { background: var(--gray-light); }
  .cal-day.empty { cursor: default; }
  .cal-day.empty:hover { background: transparent; }
  .cal-day.today { font-weight: 800; color: var(--primary-dark); box-shadow: inset 0 0 0 2px var(--primary); }
  .cal-day.has-events { color: var(--ink); font-weight: 700; background: var(--orange-light); }
  .cal-day .cal-dot { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--orange); }
  .cal-day-list { margin-top: 10px; border-top: 1px dashed var(--gray-light); padding-top: 10px; }
  .cal-day-list .item {
    display: flex; align-items: center; gap: 8px; padding: 7px 4px; font-size: 13px;
    border-radius: 10px; cursor: pointer;
  }
  .cal-day-list .item:active { background: var(--gray-light); }
  .cal-day-list .item .t { color: var(--ink-2); font-weight: 700; font-variant-numeric: tabular-nums; }
  .cal-day-list .item .c { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-day-list .item .st { font-size: 11px; font-weight: 700; color: #fff; padding: 2px 8px; border-radius: 8px; }
  .cal-day-list .cal-ics {
    width: 100%; margin-top: 8px; border: none; cursor: pointer;
    background: var(--primary-light); color: var(--primary-dark);
    font-size: 13px; font-weight: 700; padding: 10px; border-radius: 12px; font-family: inherit;
  }

  /* ===== Offer 对比 ===== */
  .cmp-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cmp-table { border-collapse: collapse; width: 100%; min-width: 420px; font-size: 13px; }
  .cmp-table th, .cmp-table td {
    padding: 10px 12px; border-bottom: 1px solid var(--gray-light); text-align: left;
    vertical-align: top;
  }
  .cmp-table thead th { font-size: 12px; color: var(--ink-2); font-weight: 700; white-space: nowrap; }
  .cmp-table td.co { font-weight: 800; color: var(--primary-dark); white-space: nowrap; }
  .cmp-empty { text-align: center; color: var(--gray); padding: 30px 0; font-size: 13px; line-height: 1.7; }

  /* ===== 状态快捷切换菜单 ===== */
  .st-menu-mask { position: fixed; inset: 0; z-index: 140; display: none; }
  .st-menu-mask.show { display: block; }
  .st-menu-mask .mask { position: absolute; inset: 0; background: rgba(31, 41, 55, .35); }
  .st-menu {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 0; width: 100%; max-width: 480px; background: #fff;
    border-radius: 24px 24px 0 0; padding: 18px 20px calc(18px + var(--safe-bottom));
    animation: slideup .22s;
  }
  .st-menu h4 { font-size: 16px; font-weight: 800; text-align: center; margin-bottom: 14px; }
  .st-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .st-opt {
    border: none; cursor: pointer; padding: 10px 4px; border-radius: 12px;
    font-size: 13px; font-weight: 700; font-family: inherit;
    background: var(--gray-light); color: var(--ink-2); transition: all .15s;
  }
  .st-opt:active { transform: scale(.95); }
  .st-opt.cur { color: #fff; }

  /* ===== 语义化 Badge ===== */
  .badge.sem { color: var(--ink); }
  .badge.sem.offer { background: var(--primary-light); color: var(--primary-dark); }
  .badge.sem.progress { background: var(--blue-light); color: var(--blue); }
  .badge.sem.done { background: var(--gray-light); color: var(--ink-2); }
  .badge.sem.warn { background: var(--orange-light); color: var(--orange); }

  /* ===== 复盘摘要 ===== */
  .review-pill {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px;
    color: var(--purple); background: var(--purple-light);
    padding: 4px 10px; border-radius: 10px; margin-top: 8px;
  }

  /* ===== 空状态插画 ===== */
  .empty-art { font-size: 56px; line-height: 1; margin-bottom: 12px; }
</style>
</head>

<script>
'use strict';
/* ================= 状态定义 ================= */
const STATUS = {
  submitted:  { label: '已投递', color: '#FFC53D', av: 'linear-gradient(135deg,#FFC53D,#F5A623)' },
  screening:  { label: '筛选中', color: '#FF8A5C', av: 'linear-gradient(135deg,#FF8A5C,#F4683B)' },
  interview1: { label: '一面',   color: '#4C7DFF', av: 'linear-gradient(135deg,#4C7DFF,#3B5BDB)' },
  interview2: { label: '二面',   color: '#7C5CFF', av: 'linear-gradient(135deg,#7C5CFF,#5B3FE0)' },
  interview3: { label: '三面',   color: '#00B8D9', av: 'linear-gradient(135deg,#00B8D9,#0091AB)' },
  hr:         { label: 'HR面',   color: '#F068A8', av: 'linear-gradient(135deg,#F068A8,#D64E8E)' },
  offer:      { label: '已Offer',color: '#00C896', av: 'linear-gradient(135deg,#00C896,#00A97F)' },
  declined:   { label: '拒Offer', color: '#475569', av: 'linear-gradient(135deg,#64748B,#475569)' },
  rejected:   { label: '被拒', color: '#94A3B8', av: 'linear-gradient(135deg,#94A3B8,#64748B)' },
};
const STATUS_ORDER = ['submitted', 'screening', 'interview1', 'interview2', 'interview3', 'hr', 'offer', 'declined', 'rejected'];
/* 看板分组：把 9 个细状态归到 4 个阶段列 */
const KANBAN_COLS = [
  { k: 'applied', label: '已投递', color: '#FFC53D', statuses: ['submitted'] },
  { k: 'active',  label: '进行中', color: '#4C7DFF', statuses: ['screening', 'interview1', 'interview2', 'interview3', 'hr'] },
  { k: 'offer',   label: '已Offer', color: '#00C896', statuses: ['offer'] },
  { k: 'closed',  label: '已结束', color: '#94A3B8', statuses: ['rejected', 'declined'] },
];
const STORE_KEY = 'interviewTracker.v1';

/* ================= 数据 ================= */
let records = [];
let filter = 'all';
let editingId = null;
let viewMode = 'list';   // list / kanban / calendar / compare
let calMonth = '';       // 日历当前月 YYYY-MM
let stMenuId = null;     // 状态快捷菜单对应的记录

function load() {
  try { records = JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch (e) { records = []; }
  // 数据迁移 v2：旧「终面(final)」→「HR面(hr)」；未知状态兜底为「已投递」
  let migrated = false;
  records.forEach(r => {
    if (r.status === 'final') { r.status = 'hr'; migrated = true; }
    else if (!STATUS[r.status]) { r.status = 'submitted'; migrated = true; }
  });
  if (migrated) save();
}
function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(records));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const t = new Date(todayStr() + 'T00:00:00');
  const d = new Date(dateStr + 'T00:00:00');
  return Math.round((d - t) / 86400000);
}

/* ================= 渲染：chips ================= */
function renderChips() {
  const counts = { all: records.length };
  STATUS_ORDER.forEach(k => counts[k] = records.filter(r => r.status === k).length);
  const chips = document.getElementById('chips');
  const defs = [{ k: 'all', label: '全部', dot: null }];
  STATUS_ORDER.forEach(k => defs.push({ k, label: STATUS[k].label, dot: STATUS[k].color }));
  chips.innerHTML = defs.map(d => `
    <button class="chip ${filter === d.k ? 'active' : ''}" data-k="${d.k}">
      ${d.dot ? `<span class="dot" style="background:${d.dot}"></span>` : ''}${d.label}
      <span style="opacity:.75;margin-left:2px">${counts[d.k] || ''}</span>
    </button>`).join('');
  chips.querySelectorAll('.chip').forEach(c => c.onclick = () => { filter = c.dataset.k; renderAll(); });
}

/* ================= 渲染：统计 ================= */
function renderStats() {
  const active = records.filter(r => !['offer', 'rejected', 'declined'].includes(r.status)).length;
  const upcoming = records.filter(r => { const d = daysUntil(r.nextDate); return d !== null && d >= 0; }).length;
  const offer = records.filter(r => r.status === 'offer').length;
  document.getElementById('stActive').textContent = active;
  document.getElementById('stUpcoming').textContent = upcoming;
  document.getElementById('stOffer').textContent = offer;
  document.getElementById('stTotal').textContent = records.length;
}

/* ================= 渲染：提醒 ================= */
function renderReminder() {
  const box = document.getElementById('reminder');
  const upcoming = records
    .filter(r => r.nextDate && daysUntil(r.nextDate) >= 0 && !['offer', 'rejected', 'declined'].includes(r.status))
    .sort((a, b) => a.nextDate.localeCompare(b.nextDate) || (a.nextTime || '').localeCompare(b.nextTime || ''));
  if (!upcoming.length) { box.classList.remove('show'); return; }
  const r = upcoming[0];
  const d = daysUntil(r.nextDate);
  let cd = '今天';
  if (d === 1) cd = '明天';
  else if (d === 2) cd = '后天';
  else if (d > 2) cd = d + '天后';
  document.getElementById('remTitle').textContent = '⏰ ' + r.company + ' 即将面试';
  document.getElementById('remSub').textContent = `${r.position || '面试'} · ${r.nextDate}${r.nextTime ? ' ' + r.nextTime : ''}`;
  document.getElementById('remCount').textContent = cd;
  box.classList.add('show');
}

/* ================= 渲染：列表 ================= */
function filtered() {
  return filter === 'all' ? records : records.filter(r => r.status === filter);
}
function renderList() {
  const list = document.getElementById('list');
  const listData = filtered();
  document.getElementById('listTitle').textContent = filter === 'all' ? '全部面试' : STATUS[filter].label + ' · ' + filterLabel();
  document.getElementById('listCount').textContent = listData.length + ' 条';
  if (!listData.length) {
    list.innerHTML = `<div class="empty">
      <div class="empty-art">${records.length ? '🗂️' : '🚀'}</div>
      <h3>${records.length ? '这个进度下还没有记录' : '还没有面试记录'}</h3>
      <p>${records.length ? '试试切换其他进度筛选' : '点击右下角 + 按钮，开启你的求职之旅吧'}</p>
    </div>`;
    return;
  }
  list.innerHTML = listData.map(r => cardHTML(r)).join('');
  list.querySelectorAll('.card').forEach(card => {
    card.onclick = (e) => {
      if (e.target.closest('.btn')) return;
      openEditor(card.dataset.id);
    };
  });
  list.querySelectorAll('[data-act]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = btn.closest('.card').dataset.id;
      const act = btn.dataset.act;
      if (act === 'advance') advanceStatus(id);
      else if (act === 'reject') rejectRecord(id);
      else if (act === 'decline') declineOffer(id);
      else if (act === 'edit') openEditor(id);
      else if (act === 'delete') confirmDelete(id);
    };
  });
  list.querySelectorAll('.kc-st2').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); openStMenu(el.closest('.card').dataset.id); };
  });
}
function filterLabel() {
  if (filter === 'all') return '';
  if (filter === 'interview1' || filter === 'interview2' || filter === 'interview3' || filter === 'hr') return '面试中';
  return '';
}
function cardHTML(r) {
  const st = STATUS[r.status];
  const d = daysUntil(r.nextDate);
  let nextHTML = '';
  if (d !== null && d >= 0 && !['offer', 'rejected', 'declined'].includes(r.status)) {
    const lbl = d === 0 ? '今天' : d === 1 ? '明天' : d === 2 ? '后天' : d + '天后';
    nextHTML = `<span class="item next">📅 ${r.nextDate}${r.nextTime ? ' ' + r.nextTime : ''}（${lbl}）</span>`;
  }
  const undone = r.todos ? r.todos.filter(t => !t.done).length : 0;
  const todosHTML = r.todos && r.todos.length
    ? `<div class="todos">${r.todos.slice(0, 2).map(t => `<span class="todo-pill ${t.done ? 'done' : ''}">${t.done ? '✓' : '○'} ${esc(t.text)}</span>`).join('')}${r.todos.length > 2 ? `<span class="todo-pill">+${r.todos.length - 2}</span>` : ''}</div>` : '';
  const isEnd = r.status === 'rejected' || r.status === 'declined';
  const isOffer = r.status === 'offer';
  const isActive = !isEnd && !isOffer;
  const semClass = isOffer ? 'offer' : isEnd ? 'done' : isActive && ['submitted', 'screening'].includes(r.status) ? 'warn' : 'progress';
  const hasReview = r.review && (r.review.questions || r.review.good || r.review.improve);
  return `
  <div class="card" data-id="${r.id}" style="--st:${st.color};--av:${st.av}">
    <div class="row1">
      <div class="avatar">${esc(initials(r.company))}</div>
      <div class="main">

/* ================= 转化率漏斗 ================= */
function funnelData() {
  const total = records.length;
  const toInterview = records.filter(r => ['screening', 'interview1', 'interview2', 'interview3', 'hr', 'offer'].includes(r.status)).length;
  const offer = records.filter(r => r.status === 'offer').length;
  return {
    total, toInterview, offer,
    inviteRate: total ? Math.round(toInterview / total * 100) : 0,
    offerRate: toInterview ? Math.round(offer / toInterview * 100) : 0,
  };
}
function renderFunnel() {
  const box = document.getElementById('funnelBox');
  if (!records.length) { box.innerHTML = ''; return; }
  const f = funnelData();
  const max = Math.max(f.total, 1);
  const bar = (n, color, label, note) => `
    <div class="funnel-row">
      <div class="f-label">${label}</div>
      <div class="f-bar-wrap">
        <div class="f-bar" style="width:${Math.max(8, n / max * 100)}%;background:${color}">${n}</div>
        ${note ? `<span class="f-note">${note}</span>` : ''}
      </div>
    </div>`;
  box.innerHTML = `
    <div class="funnel-card">
      <h2>求职转化漏斗</h2>
      ${bar(f.total, '#94A3B8', '投递', '')}
      ${bar(f.toInterview, '#4C7DFF', '进面试', f.inviteRate + '% 邀请率')}
      ${bar(f.offer, '#00C896', '拿Offer', f.offerRate + '% 成功率')}
      <div class="funnel-tip">投递 → 面试邀请率 <b>${f.inviteRate}%</b>；面试 → Offer 成功率 <b>${f.offerRate}%</b>。数据越多越有参考价值。</div>
    </div>`;
}

/* ================= 日历 ================= */
function calDays(yyyymm) {
  const [y, m] = yyyymm.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const startDow = (first.getDay() + 6) % 7; // 周一开头
  const daysInMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(yyyymm + '-' + String(d).padStart(2, '0'));
  while (cells.length % 7) cells.push(null);
  return cells;
}
function renderCalendar() {
  if (!calMonth) calMonth = todayStr().slice(0, 7);
  const list = document.getElementById('list');
  const [y, m] = calMonth.split('-').map(Number);
  const events = {};
  records.forEach(r => {
    if (r.nextDate && !['offer', 'rejected', 'declined'].includes(r.status)) {
      (events[r.nextDate] = events[r.nextDate] || []).push(r);
    }
  });
  const today = todayStr();
  const cells = calDays(calMonth).map(date => {
    if (!date) return `<button class="cal-day empty"></button>`;
    const has = events[date];
    const cls = ['cal-day'];
    if (date === today) cls.push('today');
    if (has && has.length) cls.push('has-events');
    return `<button class="${cls.join(' ')}" data-date="${date}">${parseInt(date.slice(8), 10)}${has ? '<span class="cal-dot"></span>' : ''}</button>`;
  }).join('');
  const sel = document.querySelector('.cal-day-list');
  const selDate = sel ? sel.dataset.date : null;
  let dayList = '';
  if (selDate && events[selDate]) {
    dayList = `<div class="cal-day-list" data-date="${selDate}">
      ${events[selDate].map(r => {
        const st = STATUS[r.status];
        return `<div class="item" data-id="${r.id}"><span class="t">${r.nextTime || ''}</span><span class="c">${esc(r.company)}${r.position ? ' · ' + esc(r.position) : ''}</span><span class="st" style="background:${st.color}">${st.label}</span></div>`;
      }).join('')}
      <button class="cal-ics" data-d="${selDate}">➕ 添加到系统日历（导出 .ics）</button>
    </div>`;
  } else if (selDate) {
    dayList = `<div class="cal-day-list" data-date="${selDate}"><div style="text-align:center;color:var(--gray);padding:8px 0;font-size:12px">这天没有安排面试</div></div>`;
  }
  list.innerHTML = `
    <div class="cal-card">
      <div class="cal-head">
        <div class="cal-title">${calMonth.split('-')[0]} 年 ${parseInt(calMonth.split('-')[1], 10)} 月</div>
        <div class="cal-nav">
          <button id="calPrev">‹</button>
          <button id="calNext">›</button>
        </div>
      </div>
      <div class="cal-grid">
        ${['一','二','三','四','五','六','日'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
      ${dayList}
    </div>`;
  document.getElementById('calPrev').onclick = () => { calMonth = shiftMonth(calMonth, -1); renderCalendar(); };
  document.getElementById('calNext').onclick = () => { calMonth = shiftMonth(calMonth, 1); renderCalendar(); };
  list.querySelectorAll('.cal-day:not(.empty)').forEach(b => {
    b.onclick = () => {
      const prev = document.querySelector('.cal-day-list');
      if (prev) prev.remove();
      const date = b.dataset.date;
      // 重新渲染以选中当天（简化：直接在容器后追加列表）
      renderCalendar();
      setTimeout(() => {
        const box = document.createElement('div');

          }).join('') + `<button class="cal-ics" data-d="${date}">➕ 添加到系统日历（导出 .ics）</button>`;
        } else {
          box.innerHTML = `<div style="text-align:center;color:var(--gray);padding:8px 0;font-size:12px">这天没有安排面试</div>`;
        }

  });
}
function shiftMonth(yyyymm, delta) {
  const [y, m] = yyyymm.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function exportICS(dateStr) {
  const evs = records.filter(r => r.nextDate === dateStr && !['offer', 'rejected', 'declined'].includes(r.status));
  if (!evs.length) { toast('这天没有面试'); return; }
  const stamp = (ds, ts) => {
    const [y, m, d] = ds.split('-').map(Number);
    if (ts) { const [hh, mm] = ts.split(':').map(Number); return new Date(y, m - 1, d, hh, mm); }
    return new Date(y, m - 1, d, 9, 0);
  };
  const fmt = (dt) => dt.getFullYear() + String(dt.getMonth() + 1).padStart(2, '0') + String(dt.getDate()).padStart(2, '0') + 'T' + String(dt.getHours()).padStart(2, '0') + String(dt.getMinutes()).padStart(2, '0') + '00';
  const now = new Date();
  const stampNow = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0') + 'T' + String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0') + '00';
  const escIcs = (s) => String(s || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Qiuzhilu//CN',
    'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    ...evs.map(r => {
      const start = stamp(dateStr, r.nextTime);
      const end = new Date(start.getTime() + 60 * 60 * 1000);
      return [
        'BEGIN:VEVENT',
        'UID:' + r.id + '@qiuzhilu',
        'DTSTAMP:' + stampNow,
        'DTSTART:' + fmt(start),
        'DTEND:' + fmt(end),
        'SUMMARY:' + escIcs(r.company + (r.position ? ' 面试 - ' + r.position : ' 面试')),
        'DESCRIPTION:' + escIcs((r.link ? '岗位链接: ' + r.link + '\n' : '') + (r.notes || '')),
        'LOCATION:' + escIcs(r.city || ''),
        'END:VEVENT'
      ].join('\r\n');
    }),
    'END:VCALENDAR'
  ].join('\r\n');
  download('面试_' + dateStr + '.ics', lines, 'text/calendar;charset=utf-8');
  // iOS PWA / 安卓 的明确操作指引
  const isIOSPWA = window.navigator.standalone === true;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (isIOSPWA || isIOS) {
    toast('已下载 .ics：去「文件」App → 找到文件 → 选「日历」打开');
  } else {
    toast('已下载 .ics 文件，双击或用日历 App 打开即可');
  }
}

    <thead><tr><th>对比项</th>${offers.map(r => `<th>${esc(r.company)}</th>`).join('')}</tr></thead>
    <tbody>
      <tr><td class="co">公司</td>${offers.map(r => `<td>${esc(r.company)}${r.position ? '<br><span style="font-weight:400;color:var(--ink-2)">' + esc(r.position) + '</span>' : ''}</td>`).join('')}</tr>
      <tr><td class="co">基本月薪</td>${offers.map(r => `<td>${esc(get(r, 'base'))}</td>`).join('')}</tr>
      <tr><td class="co">绩效/年终</td>${offers.map(r => `<td>${esc(get(r, 'bonus'))}</td>`).join('')}</tr>
      <tr><td class="co">期权/股票</td>${offers.map(r => `<td>${esc(get(r, 'stock'))}</td>`).join('')}</tr>
      <tr><td class="co">加班情况</td>${offers.map(r => `<td>${esc(get(r, 'overtime'))}</td>`).join('')}</tr>
      <tr><td class="co">通勤时间</td>${offers.map(r => `<td>${esc(get(r, 'commute'))}</td>`).join('')}</tr>
    </tbody>
  </table></div>
  <div class="funnel-tip" style="margin-top:10px;padding:0 4px">💡 点击某一行记录可补充完整的薪资福利信息。</div>`;
  list.querySelectorAll('.cmp-table td').forEach(() => {});
}

/* ================= 状态快捷切换 ================= */
function openStMenu(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  stMenuId = id;
  document.getElementById('stMenuTitle').textContent = '切换「' + r.company + '」的状态';
  document.getElementById('stMenuGrid').innerHTML = STATUS_ORDER.map(k => {
    const st = STATUS[k];
    return `<button class="st-opt ${k === r.status ? 'cur' : ''}" data-k="${k}" style="${k === r.status ? 'background:' + st.color : ''}">${st.label}</button>`;
  }).join('');
  document.getElementById('stMenuGrid').querySelectorAll('.st-opt').forEach(b => {
    b.onclick = () => {
      const rec = records.find(x => x.id === stMenuId);
      if (rec) { rec.status = b.dataset.k; rec.updatedAt = Date.now(); save(); renderAll(); toast('已切换为「' + STATUS[b.dataset.k].label + '」'); }
      closeStMenu();
    };
  });
  document.getElementById('stMenuMask').classList.add('show');
}
function closeStMenu() { document.getElementById('stMenuMask').classList.remove('show'); stMenuId = null; }

/* ================= 导出 / 备份 ================= */
function download(filename, content, mime) {
  // 用 data URL 而非 Blob URL，兼容 iOS PWA standalone 模式（iOS WebKit 会阻止 Blob 下载）
  const a = document.createElement('a');
  a.href = 'data:' + mime + ',' + encodeURIComponent(content);
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 500);
}
/* CSV 单元格转义。除了常规的引号/换行处理，还要给 = + - @ 开头的内容加前导单引号，
   否则 Excel / Numbers 会把它当公式执行（备注里写「=1+1」或恶意内容都会中招）。
   纯数字（如 -3000）不加，避免把合法的负数变成文本。 */
function csvCell(v) {
  v = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(v) && !/^[-+]?\d+(\.\d+)?$/.test(v)) v = "'" + v;
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function exportCSV() {
  const head = ['公司名称', '职位', '城市', '薪资范围', '当前进度', '下次面试日期', '面试时间', '待办事项', '备注', '岗位链接', '创建时间'];
  const rows = records.map(r => [
    r.company, r.position, r.city, r.salary, STATUS[r.status].label,
    r.nextDate || '', r.nextTime || '',
    (r.todos || []).map(t => (t.done ? '[已完成]' : '') + t.text).join('；'),
    r.notes, r.link,
    new Date(r.createdAt || Date.now()).toLocaleString('zh-CN'),
  ]);
  const csv = '\ufeff' + [head, ...rows].map(row => row.map(csvCell).join(',')).join('\r\n');
  download('求职录_' + todayStr() + '.csv', csv, 'text/csv;charset=utf-8');
  toast('已导出 CSV，可用 Excel 打开');
}
function exportJSON() {
  download('求职录备份_' + todayStr() + '.json', JSON.stringify({ app: '求职录', version: 1, exportedAt: new Date().toISOString(), records }, null, 2), 'application/json');
  toast('已导出 JSON 备份');
}
function importJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const arr = Array.isArray(data) ? data : (data.records || []);
      if (!arr.length) { toast('备份中没有数据'); return; }
      confirmBox('导入 ' + arr.length + ' 条记录？', '导入后将与当前数据合并（按记录 ID 去重），现有数据保留。', () => {
        const ids = new Set(records.map(r => r.id));
        arr.forEach(r => { if (r && r.company && !ids.has(r.id)) { records.push(r); ids.add(r.id); } });
        save(); renderAll();
        toast('已导入 ' + records.length + ' 条记录');
      });
    } catch (e) { toast('文件解析失败，请确认是备份 JSON 文件'); }
  };
  reader.readAsText(file);
}

/* ================= 通知 ================= */
function maybeNotify() {
  const upcoming = records.filter(r => r.nextDate === todayStr() && !['offer', 'rejected', 'declined'].includes(r.status));
  if (!upcoming.length) return;
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    const r = upcoming[0];
    new Notification('今日面试提醒', { body: `${r.company} · ${r.position || '面试'} ${r.nextTime ? r.nextTime : '今天'}`, icon: 'icons/icon-192.png' });
  }
}

/* ================= Toast / Confirm ================= */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
let cfCallback = null;
function confirmBox(title, text, ok) {
  document.getElementById('cfTitle').textContent = title;
  document.getElementById('cfText').textContent = text;
  cfCallback = ok;
  document.getElementById('confirmMask').classList.add('show');
}
function closeConfirm() { document.getElementById('confirmMask').classList.remove('show'); cfCallback = null; }

/* ================= 工具 ================= */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escAttr(s) { return esc(s).replace(/&quot;/g, '"'); }
function initials(name) {
  name = String(name || '').trim();
  if (!name) return '?';
  if (/^[\u4e00-\u9fa5]/.test(name)) return name.slice(0, 2);
  const parts = name.split(/[\s._-]+/).filter(Boolean);
  return parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : name.slice(0, 2).toUpperCase();
}

/* ================= 事件绑定 ================= */
document.getElementById('btnAdd').onclick = () => openEditor(null);
document.getElementById('editorClose').onclick = closeEditor;
document.getElementById('editorMask').onclick = (e) => { if (e.target.id === 'editorMask') closeEditor(); };
document.getElementById('btnSave').onclick = saveEditor;
document.getElementById('btnDelete').onclick = () => { if (editingId) confirmDelete(editingId); };
document.getElementById('btnAddTodo').onclick = addTodo;
document.getElementById('btnExport').onclick = () => document.getElementById('exportMenu').classList.add('show');
document.getElementById('exportMask').onclick = () => document.getElementById('exportMenu').classList.remove('show');
document.getElementById('optCsv').onclick = () => { document.getElementById('exportMenu').classList.remove('show'); exportCSV(); };
document.getElementById('optJson').onclick = () => { document.getElementById('exportMenu').classList.remove('show'); exportJSON(); };
document.getElementById('optImport').onclick = () => { document.getElementById('exportMenu').classList.remove('show'); document.getElementById('fileImport').click(); };
document.getElementById('fileImport').onchange = (e) => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ''; };
document.getElementById('optClear').onclick = () => {
  document.getElementById('exportMenu').classList.remove('show');
  confirmBox('清空全部数据？', '将删除本机上的所有面试记录，此操作不可恢复。建议先导出备份。', () => {
    records = []; save(); renderAll();
    toast('已清空全部数据');
  });
};
document.getElementById('cfOk').onclick = () => { const cb = cfCallback; closeConfirm(); if (cb) cb(); };
document.getElementById('cfCancel').onclick = closeConfirm;

/* 视图切换 */
document.querySelectorAll('.view-switch button').forEach(b => b.onclick = () => { viewMode = b.dataset.view; renderAll(); });

/* 状态快捷切换菜单 */
document.getElementById('stMenuBg').onclick = closeStMenu;

/* ================= 启动 ================= */
fillStatusSelect();
load();
renderAll();

/* PWA：Service Worker 注册 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
/* 添加到主屏幕提示：仅当独立模式未启用时，短暂显示（3.5 秒后自动收起） */
if (!window.matchMedia('(display-mode: standalone)').matches && !navigator.standalone) {
  const hint = document.getElementById('installHint');
  hint.classList.add('show');
  setTimeout(() => hint.classList.remove('show'), 6000);
}
/* 请求通知权限（用户点击添加记录后更容易接受，这里静默申请一次） */
if ('Notification' in window && Notification.permission === 'default') {
  setTimeout(() => Notification.requestPermission().catch(() => {}), 3000);
}
</script>
